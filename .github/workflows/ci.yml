name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check formatting (CSharpier)
        run: |
          dotnet tool restore
          dotnet csharpier check .

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # the corpus-wide checks need an AVEVA install; they skip without one
      CTG_SKIP_HEAVY: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build engine/CicodeSim.sln -c Release

      - name: Check builtins/behaviour.json is current
        run: dotnet engine/src/ctsim-dev/bin/Release/net10.0/ctsim-dev.dll builtins-behaviour --check builtins/behaviour.json

      - name: Test (net10.0)
        run: dotnet test engine/tests/CicodeSim.Tests/CicodeSim.Tests.csproj -c Release -f net10.0 --no-build --logger "trx;LogFileName=net10.trx" --results-directory TestResults

      - name: Test (net48)
        run: dotnet test engine/tests/CicodeSim.Tests/CicodeSim.Tests.csproj -c Release -f net48 --no-build --logger "trx;LogFileName=net48.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
